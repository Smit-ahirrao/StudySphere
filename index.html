<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="StudySphere is a premium student productivity platform for tasks, notes, planner, focus sessions, and AI-powered revision tools." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="StudySphere | Premium Productivity" />
    <meta property="og:description" content="Plan smarter, focus deeper, and revise faster with tasks, notes, planner, focus mode, and AI study tools in one app." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="https://study-sphere-two.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StudySphere | Premium Productivity" />
    <meta name="twitter:description" content="A premium all-in-one student workspace for planning, deep focus, and AI-assisted learning." />
    <meta name="twitter:image" content="/og-image.jpg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>StudySphere | Premium Productivity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('studysphere_data_v2') || localStorage.getItem('studysphere_data_v1');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var theme = parsed && parsed.settings && parsed.settings.theme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (error) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-950 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
